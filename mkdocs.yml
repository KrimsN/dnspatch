site_name: dnspatch
site_description: A dynamic DNS daemon in Go that watches your public IP address and patches your DNS records when it changes.
site_url: https://dnspatch.github.io/dnspatch/
repo_url: https://github.com/dnspatch/dnspatch
repo_name: dnspatch/dnspatch
edit_uri: edit/main/docs/

docs_dir: docs
# Fail the build on a broken link or a page missing from the nav, so a bad
# reference never reaches main.
strict: true

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # Pulls files into pages with --8<-- "path", relative to the repository root,
  # so the examples shown on the site are the real files.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
  - Configuration:
      - Overview: configuration/index.md
      - Retrievers and address families: configuration/retrievers.md
      - Secrets: configuration/secrets.md
      - Proxies: configuration/proxies.md
      - Built-in plugins: configuration/plugins.md
      - Parameter reference: PARAMETERS.md
      - Examples: configuration/examples.md
  - Deployment:
      - Docker: deployment/docker.md
      - Building from source: deployment/building.md
  - Operations:
      - Behaviour: operations/behaviour.md
      - Monitoring: operations/monitoring.md
      - Notification event types: operations/notification-events.md
  - Development:
      - Writing a plugin: development/writing-a-plugin.md
      - Plugins outside the repository: development/external-plugins.md
  - Migrations:
      - From 0.3 to 0.4: migrations/0.3-to-0.4.md
      - From 0.2 to 0.3: migrations/0.2-to-0.3.md

plugins:
  - search
  # Writes /llms.txt and /llms-full.txt for AI assistants from the pages below.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        dnspatch is a dynamic DNS daemon in Go: it watches the public IP address
        and patches DNS records when it changes. Retrievers report the address,
        providers write it to a DNS host, and instances tie them together.
      sections:
        Getting started:
          - index.md: Overview and concepts
          - installation.md: Binary, Docker and building from source
          - quick-start.md: A first configuration and the command line
        Configuration:
          - configuration/index.md: The configuration file
          - configuration/retrievers.md: Dual-stack and fallback between retrievers
          - configuration/secrets.md: Environment variables and secret files
          - configuration/proxies.md: Reaching a DNS API through a proxy
          - configuration/plugins.md: Built-in retrievers, providers and notifiers
          - PARAMETERS.md: Every parameter of every plugin
          - configuration/examples.md: Ready-made configuration files
        Deployment:
          - deployment/docker.md: Running in a container
          - deployment/building.md: Build tags and cross-compiling
        Operations:
          - operations/behaviour.md: Failure handling and state
          - operations/monitoring.md: Health check, pings and notifications
          - operations/notification-events.md: Notification event types, message fields and when each is sent
        Development:
          - development/writing-a-plugin.md: Writing a plugin
          - development/external-plugins.md: Plugins outside the repository
