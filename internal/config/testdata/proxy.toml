# A provider whose API only accepts requests from a fixed address is reached
# through a proxy on a host with that address. The URL, which may hold a login
# and password, comes from the environment so that it stays out of this file.
interval = "5m"

# A retriever connects without a proxy unless it is given one; it reports the
# address the service sees, and behind a proxy that is the proxy's address.
[retriever.home]
type = "ifconfigco"

[retriever.via-vps]
type  = "ifconfigco"
proxy = "${PROXY_URL}"

[provider.regru]
type     = "regru"
username = "${REGRU_USERNAME}"
password = "${REGRU_PASSWORD}"
zone     = "example.com"
rr_name  = "home"
proxy    = "${PROXY_URL}"

[[instance]]
name = "home"

[[instance.retriever]]
ref = "home"

# Uses the proxy of the definition.
[[instance.provider]]
ref = "regru"

# Overrides it for one reference: another proxy...
[[instance.provider]]
ref     = "regru"
rr_name = "www"
proxy   = "https://proxy.example.net:8443"

# ...or no proxy at all, whatever HTTP_PROXY and HTTPS_PROXY say.
[[instance.provider]]
ref     = "regru"
rr_name = "direct"
proxy   = "direct"

[[instance]]
name = "vps"

# The definition's proxy, replaced for this reference.
[[instance.retriever]]
ref   = "via-vps"
proxy = "socks5://other.example.net:1080"

[[instance.provider]]
ref = "regru"
