# Polling interval used by instances that do not set their own.
interval = "5m"

# Retriever definitions, referenced by instances through "ref".
[retriever.home]
type = "ifconfigco"

[retriever.office]
type       = "example-local"
base_url   = "https://10.0.0.1"
verify_tls = false
api_token  = "${LOCAL_TOKEN}"

# Provider definitions. Any parameter can be overridden per instance.
[provider.example-main]
type      = "example"
api_token = "${MAIN_TOKEN}"
zone      = "homelab.com"
rr_name   = "@"
ttl       = 60

[provider.example-alt]
type    = "example-alt"
api_key = "literal $${NOT_EXPANDED}"
zone    = "example.org"
rr_name = "*"

# An instance ties one retriever to one or more providers.
[[instance]]
name     = "homelab"
interval = "30s"

[instance.retriever]
ref = "home"

[[instance.provider]]
ref = "example-main"

# The same definition again, for a second zone.
[[instance.provider]]
ref     = "example-main"
zone    = "homelab.net"
rr_name = "sub"

[[instance.provider]]
ref = "example-alt"

# No interval: falls back to the global one.
[[instance]]
name = "office"

[instance.retriever]
ref = "office"
verify_tls = true

[[instance.provider]]
ref  = "example-main"
zone = "office.com"
