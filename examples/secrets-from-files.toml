# Secrets read from files instead of environment variables: the format
# Docker/Kubernetes secrets use when mounted into a container. Prefer this
# over "${NAME}" when the secret must never show up in "docker inspect" or a
# process's environment.
#
# "${file:/path}" is replaced with the file's contents, minus one trailing
# newline. An unreadable file is an error, same as an unset variable.

[retriever.home]
type = "ifconfigco"

[provider.regru]
type     = "regru"
username = "CHANGE_ME"
password = "${file:./secrets/regru_password.txt}"
zone     = "example.com"
rr_name  = "home"

[[instance]]
name = "home"

[[instance.retriever]]
ref = "home"

[[instance.provider]]
ref = "regru"
