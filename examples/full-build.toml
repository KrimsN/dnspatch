# The features that need the full build (the -full image or binary, or a build
# with -tags "ping,notify_all"): a ping on every completed cycle, and status
# changes published to a message broker. The lightweight build rejects this
# file at startup instead of ignoring the two settings, so a config that uses
# them never silently does nothing.
#
# Everything else in the file is the same as on the lightweight build.

# Publishes a small JSON event to Redis Pub/Sub, by default whenever an instance
# flips between success and failure: {"event": "status", "severity": "error",
# "instance": "home", "state": "failure", "success": false, "error": "...",
# "time": "..."}. It goes to the channel dnspatch.events.<instance>; change the
# prefix with topic_prefix. Whatever subscribes to it (a bot, a relay service)
# decides what to do with it.
#
# "address" is a redis:// or rediss:// URL; it carries the password and the
# database index, so keep it in the environment, not in the file.
[notify.alerts]
type    = "redis"
address = "${REDIS_URL}"
# topic_prefix = "dnspatch.events."

# Which events it publishes. The default is ["status"]. The others are
# provider_status, retriever_status, ip_change, cycle and lifecycle (an
# instance starting and stopping).
events = ["status", "provider_status", "ip_change"]

# Each [notify.<name>] definition is its own broker connection, shared by the
# instances that list it in their notify key, each with the events of the
# definition or its own (see the instance below). Define more to reach several
# brokers, of different types or of one type with different addresses, for
# example a second Redis for another subscriber. Uncomment to try it, and add
# "backup" to the notify list of the instance below.
# [notify.backup]
# type         = "redis"
# address      = "${REDIS_URL_BACKUP}"
# topic_prefix = "backup.dnspatch."

# RabbitMQ works the same way: "address" is an amqp:// or amqps:// URL, and
# events go to the durable topic exchange "exchange" (dnspatch by default) with
# the routing key dnspatch.events.<instance>. Bind a queue to it, for example
# with the pattern dnspatch.events.#, and the events wait there while the
# consumer is away.
# [notify.queue]
# type     = "rabbitmq"
# address  = "${RABBITMQ_URL}"
# exchange = "dnspatch"
# events   = ["cycle", "lifecycle"]

[retriever.home]
type = "ifconfigco"

[provider.regru]
type     = "regru"
zone     = "example.com"
rr_name  = "home"
username = "CHANGE_ME"
password = "${PASSWORD}"

[[instance]]
name = "home"
# The notifiers this instance publishes to. Without this key it publishes to
# every notifier defined above; [] publishes to none. A name brings the events
# of the definition. To replace them for this instance only, use a
# [[instance.notify]] table with "ref" and "events" instead of this key (the two
# forms cannot be mixed). Nothing else can be overridden there: the connection
# is shared.
notify = ["alerts"]
# Called on every completed cycle (a GET on success, the same URL with /fail
# appended on failure): a dead man's switch for Healthchecks.io or an Uptime
# Kuma push monitor, which alerts when the pings stop arriving. The URL
# usually holds a secret, so it comes from the environment too.
ping_url = "${PING_URL}"

[[instance.retriever]]
ref = "home"

[[instance.provider]]
ref = "regru"
