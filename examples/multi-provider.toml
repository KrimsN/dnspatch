# Several instances and providers in one process: two independent sites,
# each on its own polling interval, one of them writing to two zones at
# two different DNS hosts.

interval = "5m"

[retriever.home]
type = "ifconfigco"

[retriever.office]
type     = "ifconfigco"
base_url = "https://10.0.0.1"

[provider.regru]
type     = "regru"
zone     = "example.com"
rr_name  = "home"
username = "CHANGE_ME"
password = "${PASSWORD}"

[provider.selectel]
type         = "selectel"
zone         = "example.net"
rr_name      = "home"
project_name = "CHANGE_ME"
account_id   = "CHANGE_ME"
username     = "CHANGE_ME"
password     = "${PASSWORD}"

# A name in the list is the same as a table with only "ref".
[[instance]]
name      = "home"
retriever = ["home"]

# Update both DNS hosts from the same address.
provider  = ["regru", "selectel"]

[[instance]]
name      = "office"
interval  = "1m"
retriever = ["office"]

# Same regru definition, a different zone for this instance: an override
# needs a table, and the list can mix names and tables.
provider  = [{ ref = "regru", zone = "example.org", rr_name = "office" }]
