// A throwaway BIND for the integration test of the rfc2136 provider: primary
// for example.com, updates allowed with a test-only TSIG key.
key "dnspatch-key" {
	algorithm hmac-sha256;
	secret "c2VjcmV0LXNlY3JldC1zZWNyZXQ=";
};

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
};

zone "example.com" {
	type primary;
	file "/zones/example.com.zone";
	allow-update { key "dnspatch-key"; };
};
