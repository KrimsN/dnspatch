# Release build configuration. Validate with: goreleaser check
version: 2

project_name: dnspatch

before:
  hooks:
    - go mod tidy

builds:
  - id: dnspatch
    main: ./cmd/dnspatch
    binary: dnspatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # 32-bit ARM is only worth shipping for Linux boxes such as a Raspberry Pi
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    # Conventional Commits types that do not belong in release notes,
    # with or without a scope. See CONTRIBUTING.md
    exclude:
      - '^(docs|test|ci|build|chore|refactor|style)(\([^)]*\))?!?:'

release:
  draft: false
  prerelease: auto
  # Appended to the notes of every release, a candidate as well: the image tag
  # is the version without the "v", the Go tag is the git tag.
  footer: |
    ## Install

    **Docker** ([Docker Hub](https://hub.docker.com/r/krimsn/dnspatch)), for `linux/amd64`, `linux/arm64` and `linux/arm/v7`:

    ```sh
    docker pull krimsn/dnspatch:{{ .Version }}
    ```

    The same tags are mirrored to `ghcr.io/krimsn/dnspatch`.

    **Go:**

    ```sh
    go install github.com/KrimsN/dnspatch/cmd/dnspatch@{{ .Tag }}
    ```

    **Binary:** download the archive for your platform below and check it against `checksums.txt`.

# The container image is built from the Dockerfile by .github/workflows/release.yml.
