# Release build configuration. Validate with: goreleaser check
version: 2

project_name: dnspatch

before:
  hooks:
    - go mod tidy

builds:
  - id: dnspatch
    main: ./cmd/dnspatch
    binary: dnspatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # 32-bit ARM is only worth shipping for Linux boxes such as a Raspberry Pi
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

  # The same binary with the optional features compiled in (see
  # cmd/dnspatch/main.go), shipped as its own archives.
  - id: dnspatch-full
    main: ./cmd/dnspatch
    binary: dnspatch
    tags:
      - ping
      - notify_all
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: dnspatch
    ids:
      - dnspatch
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: dnspatch-full
    ids:
      - dnspatch-full
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-full_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    # Conventional Commits types that do not belong in release notes,
    # with or without a scope. See CONTRIBUTING.md
    exclude:
      - '^(docs|test|ci|build|chore|refactor|style)(\([^)]*\))?!?:'

release:
  draft: false
  prerelease: auto
  # Appended to the notes of every release, a candidate as well: the image tag
  # is the version without the "v", the Go tag is the git tag.
  footer: |
    ## Install

    **Docker**, for `linux/amd64`, `linux/arm64` and `linux/arm/v7`. The same tags are on [Docker Hub](https://hub.docker.com/r/krimsn/dnspatch) and on the GitHub Container Registry:

    ```sh
    docker pull krimsn/dnspatch:{{ .Version }}
    docker pull ghcr.io/dnspatch/dnspatch:{{ .Version }}
    ```

    The `-full` tag is the same image with `ping_url` and the notifier backends compiled in:

    ```sh
    docker pull krimsn/dnspatch:{{ .Version }}-full
    ```

    **Go:**

    ```sh
    go install github.com/dnspatch/dnspatch/cmd/dnspatch@{{ .Tag }}
    go install -tags "ping,notify_all" github.com/dnspatch/dnspatch/cmd/dnspatch@{{ .Tag }}   # the full build
    ```

    **Binary:** download the archive for your platform below and check it against `checksums.txt`. `dnspatch_*` is the lightweight build, `dnspatch-full_*` the one with `ping_url` and the notifier backends.

# The container image is built from the Dockerfile by .github/workflows/release.yml.
