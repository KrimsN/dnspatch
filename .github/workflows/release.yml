name: Release

on:
  push:
    tags: ["v*"]

# Actions are pinned to a commit, since a tag can be moved. The comment names
# the release; Dependabot updates both together.
jobs:
  # Nothing is published from a tag that does not pass the checks of a pull
  # request: tests on both systems, lint, govulncheck and the image build.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    name: binaries
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag history to build the changelog
          fetch-depth: 0
      # The newest Go release, not the one in go.mod: the binary carries the
      # standard library of the compiler that built it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # goreleaser otherwise picks the tag itself, and when a release
          # candidate and the final release sit on one commit it takes the
          # candidate, whose release already exists.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # The site dnspatch/builder offers the plugins and parameters listed in
  # schema.json, so each release carries the file generated from its code and
  # tells the site to pick it up.
  schema:
    name: schema.json
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go run -tags notify_all ./cmd/gendoc -docs "$RUNNER_TEMP/PARAMETERS.md" -example "$RUNNER_TEMP/dnspatch.toml.example" -schema schema.json
      - run: gh release upload "$TAG" schema.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      # BUILDER_DISPATCH_TOKEN is a fine-grained token with Contents: write on
      # dnspatch/builder; the default token cannot reach another repository.
      # Without it the step only warns and the site is refreshed by hand.
      - run: |
          if [ -z "$BUILDER_DISPATCH_TOKEN" ]; then
            echo "::warning::BUILDER_DISPATCH_TOKEN is not set, dnspatch/builder was not notified"
            exit 0
          fi
          gh api repos/dnspatch/builder/dispatches -f event_type=schema-released -f "client_payload[tag]=$TAG"
        env:
          GH_TOKEN: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          BUILDER_DISPATCH_TOKEN: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}

  image:
    name: image (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            tags: ""
            suffix: ""
          - variant: full
            tags: ping,notify_all
            suffix: "-full"
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # DOCKERHUB_TOKEN is an access token of the Docker Hub account with the
      # Read & Write scope, not the account password.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # The full flavour gets "-full" appended to every tag, latest
          # included: without onlatest both jobs push "latest", and whichever
          # finishes last wins.
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          # The same tags go to both registries.
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/krimsn/dnspatch
          # v0.1.0 -> 0.1.0, 0.1, latest (and 0.1.0-full, 0.1-full, latest-full
          # for the full flavour). A pre-release tag does not move latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            TAGS=${{ matrix.tags }}
