name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole of CI before it publishes anything.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to a commit, since a tag can be moved. The comment names
# the release; Dependabot updates both together.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The tests include a check that docs/PARAMETERS.md and config.toml.example
      # match the plugin tags; run `go generate ./...` if it fails.
      - run: go test -race ./...

  # Branch protection requires a check named "build & test". The matrix above
  # names its jobs after the OS, so this job stands in for all of them and
  # keeps the required name stable when the matrix changes.
  test-result:
    name: build & test
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12

  # The standard library is part of the binary, so the scan runs on the newest
  # Go release, the one the image and the release binaries are built with. On
  # the older Go of go.mod it would keep reporting fixed standard-library bugs.
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The unit tests of the rfc2136 provider talk to an in-process server; this
  # job runs the same update against a real BIND, which is the reference
  # implementation of RFC 2136 and TSIG. The test key is public and only lives
  # in the throwaway container.
  rfc2136:
    name: rfc2136 (BIND 9.20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # named writes a journal next to the zone file, so the directory must be
      # writable by the unprivileged user inside the container.
      - run: |
          cp -r plugins/rfc2136/testdata/bind "$RUNNER_TEMP/bind"
          chmod -R a+rwX "$RUNNER_TEMP/bind"
          docker run -d --name bind -p 15353:53/tcp -p 15353:53/udp \
            -v "$RUNNER_TEMP/bind/named.conf:/etc/bind/named.conf:ro" \
            -v "$RUNNER_TEMP/bind:/zones" \
            internetsystemsconsortium/bind9@sha256:f8506cfcbc8fcb44e40b922fa74b481ba23b50f00482bf6693ff8f120709a778
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/15353) 2>/dev/null && break
            sleep 1
          done
          sleep 2
      - env:
          RFC2136_TEST_SERVER: 127.0.0.1:15353
          RFC2136_TEST_SECRET: c2VjcmV0LXNlY3JldC1zZWNyZXQ=
        run: go test -count=1 -v -run TestRealServer ./plugins/rfc2136
      - if: failure()
        run: docker logs bind

  # examples/*.toml are documentation, not code under test, so they are only
  # checked when they (or the parser they exercise) actually changed. On a
  # push or a workflow_call (release) there is no PR base to diff against, so
  # the step runs unconditionally there — that's cheap and rare enough not to
  # matter.
  examples:
    name: check examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- examples | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - if: steps.changed.outputs.run == 'true'
        run: go build -o /tmp/dnspatch ./cmd/dnspatch
      # Run from inside examples/ so secrets-from-files.toml's relative
      # "./secrets/..." path resolves; the other files don't care about cwd.
      - if: steps.changed.outputs.run == 'true'
        working-directory: examples
        env:
          PASSWORD: check-config-dummy
          PROXY_URL: direct
          TSIG_SECRET: Y2hlY2stY29uZmln
        run: |
          set -e
          for f in *.toml; do
            echo "::group::$f"
            /tmp/dnspatch --config "$f" --check-config
            echo "::endgroup::"
          done

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
