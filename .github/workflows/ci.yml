name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The tests include a check that docs/PARAMETERS.md and config.toml.example
      # match the plugin tags; run `go generate ./...` if it fails.
      - run: go test -race ./...

  # Branch protection requires a check named "build & test". The matrix above
  # names its jobs after the OS, so this job stands in for all of them and
  # keeps the required name stable when the matrix changes.
  test-result:
    name: build & test
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
