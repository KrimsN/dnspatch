version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # The base images of the Dockerfile are pinned by digest; without this the
  # pins would never move, and the image would stop getting Go patch releases.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
