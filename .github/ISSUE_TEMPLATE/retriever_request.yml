name: New retriever request
description: Ask for a new way to find the public IP address (an IP-echo service or a local source)
labels: ["enhancement", "plugins", "retriever"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing this, check `plugins/retrievers/` for one that already exists, and [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) if you'd rather write it yourself — the retriever interface is a public Go package, so plugins don't need to live in this repo or be written by a maintainer.

  - type: input
    id: service
    attributes:
      label: Service or source
      description: The IP-echo service, or the local source, this retriever would read the address from.
      placeholder: e.g. api.myip.com, a router status page
    validations:
      required: true

  - type: input
    id: api-docs
    attributes:
      label: Documentation or endpoint
      description: Link to the service's docs, or the URL that returns the address.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this one
      description: What you're trying to do that existing plugins don't cover.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Response and limits
      description: What the endpoint returns (plain text, JSON, ...), whether it reports IPv4, IPv6 or both, and any rate limits or required headers.
